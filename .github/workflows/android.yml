name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:test --console=plain

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Starwake-${GITHUB_SHA::7}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: starwake-apk
          path: dist/*.apk

      # Rolling pre-release so the newest APK is always one tap away on the phone:
      # https://github.com/<owner>/<repo>/releases/tag/dev-latest
      - name: Publish dev-latest pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest dist/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Starwake dev build (${GITHUB_SHA::7})" \
            --notes "Automatic build of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download the APK on your phone and open it to install (allow installs from your browser when asked)."
